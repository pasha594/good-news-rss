name: accumulate

on:
  schedule:
    # Offset minutes: GitHub sheds :00/:30 scheduled load most aggressively,
    # so off-peak minutes get dropped less often. Delivery is still
    # best-effort - classify.py self-paces its quota to tolerate any cadence.
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: accumulate
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # classify may spend up to ~21 min when backlogged
    steps:
      - uses: actions/checkout@v4

      - name: Sync to branch tip
        # A queued run's checkout SHA is frozen at creation time; if the
        # previous run pushed while this one waited, the snapshot predates
        # that push. Classify's quota pacing and dedupe must see those tag
        # rows, so hard-sync to the real tip before doing anything.
        run: |
          git fetch origin main || true
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet feedparser requests

      - name: Fetch feeds and append new articles
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: python accumulate.py

      - name: Classify new articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python classify.py

      - name: Rebuild live site
        run: python build_site.py

      - name: Build health page
        continue-on-error: true   # health must never block the site deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python build_health.py

      - name: Commit new data
        continue-on-error: true   # a git problem must never block the site deploy
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          # accumulate.py is idempotent, so on any push failure (remote moved,
          # transient server error) we reset to the remote state, re-accumulate
          # on top of it, and try again. classify.py is NOT re-run - its rows
          # are quota already spent, so they are saved across the reset and
          # replayed (line-level union) instead of being regenerated.
          for attempt in 1 2; do
            git add data/
            if git diff --cached --quiet; then
              echo "No new articles this run."
              break
            fi
            git commit -m "accumulate: $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push; then
              break
            fi
            echo "Push failed (attempt $attempt); resetting to remote and retrying."
            git rebase --abort 2>/dev/null || true
            rm -rf /tmp/tags_save && mkdir -p /tmp/tags_save
            cp data/tags-*.jsonl /tmp/tags_save/ 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            for f in /tmp/tags_save/*.jsonl; do
              [ -e "$f" ] || continue
              b=$(basename "$f")
              touch "data/$b"
              awk '!seen[$0]++' "data/$b" "$f" > "/tmp/$b.merged"
              mv "/tmp/$b.merged" "data/$b"
            done
            python accumulate.py
            python build_site.py
            if [ "$attempt" = "2" ]; then
              echo "::warning::Could not push data after 2 attempts; deploying site anyway."
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
