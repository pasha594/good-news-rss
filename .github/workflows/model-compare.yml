name: Model compare (eval)

# One-off evaluation: classify a fixed sample of RSS articles with Claude Haiku 5.5
# (hard $1 cap) and Gemini, same prompt; then the whole month with Haiku, adding the
# deciding filter and entity/location fields ($12 cap, cumulative). Runs on push to this branch or by hand;
# each job retries up to 3 times and commits its progress after every attempt. If a
# job still fails (or a batch outlasts the step timeout), the run relaunches itself to
# resume, up to 8 times.
on:
  push:
    branches: [eval/model-compare]
    paths:
      - eval/model_compare.py
      - eval/model_compare/sample_ids.txt
      - eval/model_compare/month_ids.txt
      - eval/model_compare/save.sh
      - .github/workflows/model-compare.yml
  workflow_dispatch:
    inputs:
      relaunch:
        description: "Relaunch count (set automatically)"
        default: "0"

permissions:
  contents: write
  actions: write      # lets the relaunch job start the next run

concurrency:
  group: model-compare
  cancel-in-progress: false

jobs:
  haiku:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sync to branch tip
        # A queued run starts from its trigger commit; results pushed since then
        # (including the Haiku spend ledger) must be in the checkout.
        run: |
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          git reset --hard FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet anthropic
      - name: Classify with Claude Haiku 5.5 (up to 3 attempts)
        timeout-minutes: 330
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_SYSTEM_PROMPT: ${{ secrets.EVAL_SYSTEM_PROMPT }}
          EVAL_ENTITY_PROMPT: ${{ secrets.EVAL_ENTITY_PROMPT }}
        run: |
          for attempt in 1 2 3; do
            set +e
            python eval/model_compare.py haiku --budget-usd 1.0
            rc=$?
            if [ "$rc" = 0 ] || [ "$rc" = 3 ]; then
              bash eval/model_compare/save.sh "haiku sample"
              python eval/model_compare.py haiku --ids eval/model_compare/month_ids.txt \
                --out-name haiku_month --extras --budget-usd 12
              rc=$?
            fi
            set -e
            bash eval/model_compare/save.sh "haiku attempt $attempt"
            if [ "$rc" = 0 ] || [ "$rc" = 3 ]; then exit 0; fi
            echo "Attempt $attempt failed (exit $rc); retrying in 5 minutes."
            sleep 300
          done
          exit 1
      - name: Save partial results
        if: always()
        run: bash eval/model_compare/save.sh "haiku final"

  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sync to branch tip
        # A queued run starts from its trigger commit; results pushed since then
        # (including the Haiku spend ledger) must be in the checkout.
        run: |
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          git reset --hard FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Classify with Gemini (up to 3 attempts)
        timeout-minutes: 330
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY_SECOND }}
          EVAL_SYSTEM_PROMPT: ${{ secrets.EVAL_SYSTEM_PROMPT }}
        run: |
          for attempt in 1 2 3; do
            set +e
            python eval/model_compare.py gemini
            rc=$?
            set -e
            bash eval/model_compare/save.sh "gemini attempt $attempt"
            if [ "$rc" = 0 ] || [ "$rc" = 3 ]; then exit 0; fi
            echo "Attempt $attempt failed (exit $rc); retrying in 5 minutes."
            sleep 300
          done
          exit 1
      - name: Save partial results
        if: always()
        run: bash eval/model_compare/save.sh "gemini final"

  relaunch:
    # A failed job (all attempts used, or the step timed out with a batch still
    # processing) resumes in a fresh run: done ids are skipped, pending batches are
    # collected, and the spend ledger carries over. Not on manual cancel.
    needs: [haiku, gemini]
    if: ${{ !cancelled() && (needs.haiku.result == 'failure' || needs.gemini.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ inputs.relaunch || '0' }}
        run: |
          if [ "$N" -ge 8 ]; then
            echo "::error::Gave up after 8 relaunches."
            exit 1
          fi
          gh workflow run model-compare.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f relaunch=$((N + 1))
          echo "Relaunched (#$((N + 1)))."
